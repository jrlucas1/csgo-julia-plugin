// jev_duel.cfg — você + bot CS no CT contra o Jev no T.
// Uso (console do servidor ou rcon):  exec jev_duel
// Depois:                             exec jev_demonio (ou jev_justo / jev_facil)

// ---------------------------------------------------------------- servidor
sv_lan 1                         // só LAN (combina com -insecure)
sv_cheats 0

// ---------------------------------------------------------------- warmup / rounds
mp_do_warmup_period 0
mp_warmuptime 0
mp_freezetime 2
mp_roundtime 1.5
mp_roundtime_defuse 1.5
mp_roundtime_hostage 1.5
mp_round_restart_delay 1
mp_maxrounds 999
mp_winlimit 0
mp_halftime 0                    // sem troca de lado: você fica CT, o bot fica T
mp_match_can_clinch 0
mp_timelimit 0
mp_autokick 0
mp_friendlyfire 0

// ---------------------------------------------------------------- times
mp_autoteambalance 0             // sem balanceamento
mp_limitteams 0
mp_humanteam ct                  // humanos só entram no CT
bot_quota_mode normal
bot_quota 0
bot_kick
bot_join_team t
bot_add_t                        // o plugin Jev controla o bot T
bot_join_team ct
bot_add_ct                       // bot normal acompanha você no CT
bot_quota 2                      // Jev no T + bot normal no CT
bot_join_after_player 0
bot_chatter off

// ---------------------------------------------------------------- armas, sem compra
mp_buytime 0
mp_buy_anywhere 0
mp_startmoney 0
mp_maxmoney 0
mp_playercashawards 0
mp_teamcashawards 0
mp_ct_default_primary weapon_ak47
mp_t_default_primary weapon_ak47
mp_ct_default_secondary ""
mp_t_default_secondary ""
mp_weapons_allow_map_placed 0
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_defuser 0

// armadura grátis. Confira os valores com "help mp_free_armor" no console:
// 1 = colete; em alguns builds 2 = colete + capacete.
mp_free_armor 1

// ---------------------------------------------------------------- sem C4
mp_give_player_c4 0

// ---------------------------------------------------------------- aplica
mp_restartgame 1
